name: Publikacja na GitHub Pages

# Produkcja: gałąź main → https://zbludzakowe-zabawy.github.io/Kamienickie-nutki/
# Wersja testowa ma osobny workflow (test-pages.yml) i osobny adres …/Kamienickie-nutki-test/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Przygotuj katalog strony
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest sw.js js icons _site/
          node tools/build-sw.mjs _site
          # stary adres wersji testowej → przekierowanie na nowy
          mkdir _site/test
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Wersja testowa</title>' \
            '<meta http-equiv="refresh" content="0; url=/Kamienickie-nutki-test/">' \
            '<p>Wersja testowa jest teraz pod adresem <a href="/Kamienickie-nutki-test/">/Kamienickie-nutki-test/</a>.</p>' > _site/test/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
